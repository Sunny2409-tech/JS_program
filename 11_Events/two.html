<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Chai aur code</h1>
    <button id="stop">Stop</button>
    
</body>

<script>
    const saySunny = ()=>{
        console.log("Hello Sunny ");
    }

    const changeContext = ()=>{
        document.querySelector("h1").innerHTML = "Best JS Series"
    }

    // setTimeout(saySunny,2000)
    //To stop the timeout before the timeout duration. We can use cleartimeout() 
    const clearTimeoutMe = setTimeout(changeContext,2000)
    document.querySelector("#stop").addEventListener("click", ()=>{
        clearTimeout(clearTimeoutMe)  //clear the timeout
        console.log("STOPPED")
    });

</script>
</html>
