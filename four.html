<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body style="background-color: #212121; color: #fff">
    <ul class="language">
        <li>javaScript</li>
    </ul>
</body>
<script>
    function addLanguage(langName){
        const li = document.createElement('li')
        li.innerHTML = `${langName}`
        document.querySelector(".language").appendChild(li)
    }
    addLanguage("python")
    addLanguage("java")

    function addOptimizedLanguage(langName){
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(langName))  //This is use to save from traversing, Hence we dont use innerText
        document.querySelector(".language").appendChild(li)
    }
    addOptimizedLanguage("typescript")
    addOptimizedLanguage("golang")

    //Edit
    const editSecondLang = document.querySelector("li:nth-child(2)")
    console.log("Edit second Lang : ",editSecondLang)
    // editSecondLang.innerHTML = "Mojo"  //1st way to edit
    const newLi = document.createElement('li')
    newLi.textContent = "Mojo"
    editSecondLang.replaceWith(newLi)

    //other way
    const firstLang = document.querySelector('li:first-child')
    firstLang.outerHTML = "<li>SpringBoot</li>"

    //remove
    const lastLang = document.querySelector("li:last-child")
    lastLang.remove()


</script>

</html>
